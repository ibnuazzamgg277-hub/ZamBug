<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUG ZAM — Visual Simulator</title>
<style>
:root{--red:#ff253a;--bg:#070708;--panel:#111114;--muted:#9b9ba5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2b090e 0%,#09090b 48%,#030304 100%);color:#f5f5f7;font-family:system-ui,Arial,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:440px;margin:auto}
.hero{width:100%;height:220px;object-fit:cover;border-radius:16px;border:1px solid #5c1820;filter:contrast(1.05);box-shadow:0 0 28px #ff203322}
h1{text-align:center;letter-spacing:4px;color:var(--red);text-shadow:0 0 18px #ff253a66;margin:18px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;margin-bottom:20px}
.card{background:#101013ee;border:1px solid #382026;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 10px 35px #0008}
label{display:block;font-size:12px;color:#d6bfc2;margin:12px 0 7px}
input,select{width:100%;background:#080809;border:1px solid #3d3034;border-radius:9px;padding:13px;color:#fff;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px #ff253a20}
button{width:100%;border:0;border-radius:9px;padding:13px;margin-top:12px;background:linear-gradient(90deg,#a90018,#ff253a);color:white;font-weight:800;letter-spacing:1px}
button.secondary{background:#1d1d22;border:1px solid #49383c}
.note{font-size:11px;line-height:1.5;color:#aaa;text-align:center}
.status{display:none;padding:12px;border:1px solid #513037;border-radius:9px;color:#ff9ca7;background:#210c10;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.terminal{color:#ff6575;font-size:12px;line-height:1.8;min-height:48px;white-space:pre-wrap}
.badge{display:inline-block;border:1px solid #61202a;color:#ff7887;border-radius:99px;padding:5px 9px;font-size:10px;letter-spacing:1px}

/* Animasi tambahan sahaja — reka bentuk dan fungsi asal dikekalkan */
.hero {
    animation: zam-image-glow 3s ease-in-out infinite alternate;
}
h1 {
    animation: zam-title-pulse 1.8s ease-in-out infinite alternate;
}
.badge {
    animation: zam-badge-glow 2.2s ease-in-out infinite alternate;
}
button {
    transition: transform .18s ease, box-shadow .25s ease, filter .25s ease;
}
button:hover, button:focus-visible {
    box-shadow: 0 0 16px #ff253a66;
    filter: brightness(1.12);
}
button:active {
    transform: scale(.985);
}
.card {
    animation: zam-card-in .65s ease both;
}
.card:nth-of-type(2) {
    animation-delay: .12s;
}
.terminal:not(:empty) {
    animation: zam-terminal-in .35s ease both;
}
@keyframes zam-image-glow {
    from { box-shadow: 0 0 18px #ff203322; }
    to   { box-shadow: 0 0 32px #ff253a66; }
}
@keyframes zam-title-pulse {
    from { text-shadow: 0 0 10px #ff253a44; }
    to   { text-shadow: 0 0 22px #ff253a99, 0 0 34px #ff253a33; }
}
@keyframes zam-badge-glow {
    from { box-shadow: 0 0 0 #ff253a00; }
    to   { box-shadow: 0 0 12px #ff253a44; }
}
@keyframes zam-card-in {
    from { opacity: .88; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes zam-terminal-in {
    from { opacity: .45; }
    to   { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
    .hero, h1, .badge, .card, .terminal:not(:empty) {
        animation: none !important;
    }
    button {
        transition: none;
    }
}


.hero-video{
  display:block;width:100%;height:220px;object-fit:cover;margin:12px 0 18px;
  border-radius:16px;border:1px solid #5c1820;
  box-shadow:0 0 28px #ff203322;filter:contrast(1.05);
  animation:itachiGlow 3s ease-in-out infinite alternate;
}
@keyframes itachiGlow{
  from{box-shadow:0 0 12px #ff203322}
  to{box-shadow:0 0 30px #ff203366}
}
@media(prefers-reduced-motion:reduce){.hero-video{animation:none}}

</style>
</head>

<h1>BUG ZAM</h1>
<div class="sub">V1 // VISUAL SIMULATOR</div>
<div class="card">
<span class="badge">DEMO LOKAL</span>
<label for="email">EMAIL DEMO</label>
<input id="email" type="email" placeholder="contoh@email.com" autocomplete="off">
<label for="password">PASSWORD DEMO</label>
<input id="password" type="password" placeholder="Isi contoh saja" autocomplete="off">
<button onclick="signIn()">SIGN IN</button>
<div id="loginStatus" class="status"></div>
<p class="note">Jangan masukkan password asli. Form ini tidak mengirim atau menyimpan data.</p>
</div>
<div class="card">
<label for="phone">MASUKAN NO. TARGET (UNTUK TAMPILAN DEMO)</label>
<input id="phone" inputmode="tel" placeholder="08xxxxxxxx" maxlength="15">
<label for="mode">PILIHAN SIMULASI</label>
<select id="mode">
<option value="FORCE CLOSE">FORCE CLOSE — efek visual</option>
<option value="LOCK SCREEN">LOCK SCREEN — efek visual</option>
<option value="GLITCH">GLITCH EFFECT</option>
<option value="TERMINAL">TERMINAL ANIMATION</option>
</select>
<button onclick="runDemo()">JALANKAN SIMULASI</button>
<div id="status" class="status"></div>
<div id="terminal" class="terminal"></div>
<p class="note">Tidak mengirim bug, tidak mengunci perangkat, dan tidak menghubungi nomor yang dimasukkan.</p>
<button class="secondary" onclick="resetDemo()">RESET</button>
</div>
<p class="note">BUG ZAM © 2026 · UI demo saja</p>
</div>
<script>
function signIn(){
  const email=document.getElementById('email').value.trim();
  const box=document.getElementById('loginStatus');
  box.style.display='block';
  box.textContent=email ? 'SIGN IN DEMO BERHASIL — tidak ada akun yang dibuat.' : 'Isi email demo dulu.';
}
function runDemo(){
  const phone=document.getElementById('phone').value.trim();
  const mode=document.getElementById('mode').value;
  const status=document.getElementById('status');
  const terminal=document.getElementById('terminal');
  status.style.display='block';
  if(!phone){status.textContent='Masukkan nomor contoh, misalnya 08xxxxxxxx.';terminal.textContent='';return;}
  status.textContent='SIMULASI SELESAI: '+mode+' — hanya efek di halaman ini. Tidak ada bug yang dikirim ke '+phone+'.';
  const lines=['[BUG ZAM] Memulai demo...','[OK] Memuat efek visual...','[OK] Tidak ada koneksi ke perangkat lain.','[SELESAI] SIMULASI SAJA'];
  terminal.textContent='';
  let i=0;
  const timer=setInterval(()=>{terminal.textContent+=lines[i]+'\\n';i++;if(i>=lines.length)clearInterval(timer)},350);
}
function resetDemo(){
  document.getElementById('email').value='';
  document.getElementById('password').value='';
  document.getElementById('phone').value='';
  document.getElementById('loginStatus').style.display='none';
  document.getElementById('status').style.display='none';
  document.getElementById('terminal').textContent='';
}
</script>
</body>
